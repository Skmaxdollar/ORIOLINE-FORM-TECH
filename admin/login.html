<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login | ORIOLINE & FORM TECH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-card">
    <a class="brand" href="../index.html">ORIOLINE <span>&</span> FORM TECH</a>
    <h1>Admin sign in</h1>
    <p>Sign in with the administrator account created in Supabase.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Sign in</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
    <a class="back-link" href="../index.html">Back to website</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-client.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const loginButton = document.getElementById('loginButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      if (!window.siteBackend || !window.siteBackend.ready) {
        errorBox.textContent = window.siteBackend ? window.siteBackend.error : 'Backend is unavailable.';
        return;
      }

      loginButton.disabled = true;
      try {
        const { data, error } = await window.siteBackend.client.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });
        if (error) throw error;

        const { data: allowed, error: allowlistError } = await window.siteBackend.client
          .from('admin_users').select('user_id').eq('user_id', data.user.id).maybeSingle();
        if (allowlistError) throw allowlistError;
        if (!allowed) {
          await window.siteBackend.client.auth.signOut();
          throw new Error('This account is not authorized for the admin panel.');
        }
        window.location.href = './index.html';
      } catch (error) {
        errorBox.textContent = error.message || 'Sign in failed. Please try again.';
      } finally {
        loginButton.disabled = false;
      }
    });

    if (window.siteBackend && !window.siteBackend.ready) {
      errorBox.textContent = window.siteBackend.error;
    }
  </script>
</body>
</html>
